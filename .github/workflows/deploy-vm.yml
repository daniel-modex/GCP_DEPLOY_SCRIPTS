name: Deploy GCP VM Instances

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Select environment config to deploy'
        required: true
        type: choice
        default: 'school-web-app'
        options:
          - 'pg-school-db'
          - 'SchoolWebApp'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Deployment
        env:
          APP_SECRETS_CONTENT: ${{ secrets.SCHOOLWEBAPP }}
        run: |
          CONFIG_FILE="config/${{ github.event.inputs.config_name }}.env"
          
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            CONFIG_FILE=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^config/' | head -n 1)
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file '$CONFIG_FILE' not found!"
            exit 1
          fi

          # Encode secrets safely to avoid shell escaping issues
          APP_SECRETS_ENCODED=$(echo -n "$APP_SECRETS_CONTENT" | base64 | tr -d '\r\n')
          export APP_SECRETS_ENCODED

          chmod +x scripts/deploy-vm.sh
          ./scripts/deploy-vm.sh "$CONFIG_FILE"