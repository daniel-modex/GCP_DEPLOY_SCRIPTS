name: Deploy GCP VM Instances

env:
  ALL_SECRETS_JSON: ${{ toJson(secrets) }}

on:
  workflow_dispatch:
    inputs:
      config_name:
          description: 'Select environment config to deploy'
          required: true
          type: choice
          default: 'lightweight-app'
          options:
            - 'pg-school-db'
            - 'school-web-app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

     -  name: Run Deployment
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          CONFIG_FILE="config/${{ github.event.inputs.config_name }}.env"
          
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            CONFIG_FILE=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^config/' | head -n 1)
          fi

          source "$CONFIG_FILE"

          if [ -n "$REQUIRED_SECRETS" ]; then
            echo "REQUIRED_SECRETS defined as: '$REQUIRED_SECRETS'"
            ENV_VARS_ARRAY=()
            
            # Split REQUIRED_SECRETS by comma
            IFS=',' read -ra KEYS <<< "$REQUIRED_SECRETS"
            for KEY in "${KEYS[@]}"; do
              # Clean whitespace
              KEY=$(echo "$KEY" | xargs)
              VAL=$(echo "$ALL_SECRETS_JSON" | jq -r --arg k "$KEY" '.[$k] // empty')
              
              if [ -n "$VAL" ]; then
                echo " [FOUND] Secret key: '$KEY'"
                ENV_VARS_ARRAY+=("${KEY}=${VAL}")
              else
                echo " [MISSING] Secret key '$KEY' was not found in GitHub Secrets!"
              fi
            done
            
            # Join array with commas
            ENV_VARS=$(IFS=, ; echo "${ENV_VARS_ARRAY[*]}")
            export ENV_VARS
            echo "Final ENV_VARS payload length: ${#ENV_VARS}"
          fi

          chmod +x scripts/deploy-vm.sh
          ./scripts/deploy-vm.sh "$CONFIG_FILE"