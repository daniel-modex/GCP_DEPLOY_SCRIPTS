name: Deploy GCP VM Instances

env:
  ALL_SECRETS_JSON: ${{ toJson(secrets) }}

on:
  workflow_dispatch:
    inputs:
      config_name:
          description: 'Select environment config to deploy'
          required: true
          type: choice
          default: 'lightweight-app'
          options:
            - 'pg-school-db'
            - 'school-web-app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Deployment
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |

          CONFIG_FILE="config/${{ github.event.inputs.config_name }}.env"
          source "$CONFIG_FILE"

          if [ -n "$REQUIRED_SECRETS" ]; then
            ENV_VARS_ARRAY=()
            IFS=',' read -ra KEYS <<< "$REQUIRED_SECRETS"
            for KEY in "${KEYS[@]}"; do
              KEY=$(echo "$KEY" | xargs)
              VAL=$(echo "$ALL_SECRETS_JSON" | jq -r --arg k "$KEY" '.[$k] // empty')
              if [ -n "$VAL" ]; then
                ENV_VARS_ARRAY+=("${KEY}=${VAL}")
              fi
            done
            IFS=',' ; export ENV_VARS="${ENV_VARS_ARRAY[*]}"
          fi

          chmod +x scripts/deploy-vm.sh
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CONFIG="config/${{ github.event.inputs.config_name }}.env"
          else
            CONFIG=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^config/' | head -n 1)
          fi
          
          ./scripts/deploy-vm.sh "$CONFIG"