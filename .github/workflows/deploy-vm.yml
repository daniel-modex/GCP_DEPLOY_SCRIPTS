name: Deploy GCP VM Instances

env:
  ALL_SECRETS_JSON: ${{ toJson(secrets) }}

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Select environment config to deploy'
        required: true
        type: choice
        default: 'school-web-app'
        options:
          - 'pg-school-db'
          - 'school-web-app'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Deployment
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          CONFIG_FILE="config/${{ github.event.inputs.config_name }}.env"
          
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            CONFIG_FILE=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^config/' | head -n 1)
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file '$CONFIG_FILE' not found!"
            exit 1
          fi

          source "$CONFIG_FILE"

          if [ -n "${REQUIRED_SECRETS:-}" ]; then
            echo "REQUIRED_SECRETS defined as: '$REQUIRED_SECRETS'"
            ENV_VARS_ARRAY=()
            
            # Convert comma-separated string to list safely
            CLEAN_SECRETS=$(echo "$REQUIRED_SECRETS" | tr ',' '\n')
            
            while IFS= read -r KEY; do
              KEY=$(echo "$KEY" | xargs)
              [ -z "$KEY" ] && continue
              
              VAL=$(echo "$ALL_SECRETS_JSON" | jq -r --arg k "$KEY" '.[$k] // empty')
              
              if [ -n "$VAL" ]; then
                echo " [FOUND] Secret key: '$KEY'"
                ENV_VARS_ARRAY+=("${KEY}=${VAL}")
              else
                echo " [MISSING] Secret key '$KEY' was not found in GitHub Secrets!"
              fi
            done <<< "$CLEAN_SECRETS"
            
            # Join array with commas
            DYNAMIC_ENV_VARS=$(IFS=, ; echo "${ENV_VARS_ARRAY[*]}")
            
            # Append ENV_VARS directly into the config file so deploy-vm.sh can read it when sourced
            echo "" >> "$CONFIG_FILE"
            echo "ENV_VARS=\"$DYNAMIC_ENV_VARS\"" >> "$CONFIG_FILE"
            
            export ENV_VARS="$DYNAMIC_ENV_VARS"
            echo "Successfully attached ENV_VARS payload to $CONFIG_FILE"
          fi

          chmod +x scripts/deploy-vm.sh
          ./scripts/deploy-vm.sh "$CONFIG_FILE"